name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Keeps target/ (and the caches) small; CI needs no debugger symbols.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  NSH_VERSION: v0.7.1

jobs:
  node:
    name: node (lint, typecheck, vitest, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Check the size of every terminal mock in docs/design
        run: python3 scripts/check-mocks.py
      - run: pnpm typecheck
      - run: pnpm exec vitest run
      - run: pnpm -r --if-present build

  rust:
    name: rust (fmt, clippy, test incl. SSH end-to-end)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          # The e2e job restores this cache (it builds a subset of the same debug target).
          shared-key: workspace-debug
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The end-to-end tests (crates/tty-gateway/tests) start the coffee-tui binary.
      - run: cargo build --workspace --locked
      - name: Check the shop's gateway configuration
        run: target/debug/tty-gateway --check --config deploy/gateway.toml
      - run: cargo test --workspace --locked

  e2e:
    name: e2e (real backend + tty-gateway + stock ssh, scripts/e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          # Reads the rust job's cache and adds none of its own (the cache budget is 10 GB).
          shared-key: workspace-debug
          save-if: false
      - name: Build coffee-tui and tty-gateway once
        run: cargo build --locked -p coffee-tui -p tty-gateway
      - name: Check the shop's gateway configuration
        run: target/debug/tty-gateway --check --config deploy/gateway.toml
      - name: Check report directory handling
        run: python3 -m unittest discover -s scripts/e2e
      - name: Run the flows (fresh database each)
        run: python3 scripts/e2e/run.py
        env:
          E2E_WAIT: '30'
      - name: Keep the text screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screens
          # Screens (*.txt) and logs only: not the throwaway keys or databases in work/.
          path: |
            .data/e2e/*/*.txt
            .data/e2e/*/*.log
          if-no-files-found: ignore

  nsh:
    name: nsh (check, test, test --target tui)
    runs-on: ubuntu-24.04 # the nsh Linux build needs glibc 2.39
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          # `nsh` builds its runners and hosts into apps/tui/target.
          workspaces: |
            . -> target
            apps/tui -> target
          cache-directories: ~/.cache/nsh
      - name: Cache the nsh CLI
        id: nsh-cache
        uses: actions/cache@v6
        with:
          path: ~/.nsh-dist
          key: nsh-${{ env.NSH_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install the nsh CLI (release archive, SHA-256 checked) and its tui component
        if: steps.nsh-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/longbridge/nsh/releases/download/$NSH_VERSION"
          work="$(mktemp -d)"
          curl -fsSL "$base/nsh-linux-x86_64.tar.gz" -o "$work/nsh-linux-x86_64.tar.gz"
          curl -fsSL "$base/nsh-linux-x86_64.tar.gz.sha256" -o "$work/nsh-linux-x86_64.tar.gz.sha256"
          (cd "$work" && sha256sum -c nsh-linux-x86_64.tar.gz.sha256)
          mkdir -p ~/.nsh-dist
          tar -xzf "$work/nsh-linux-x86_64.tar.gz" -C ~/.nsh-dist
          ~/.nsh-dist/nsh/bin/nsh component add tui
      - name: Put nsh on PATH
        run: |
          echo "$HOME/.nsh-dist/nsh/bin" >> "$GITHUB_PATH"
          "$HOME/.nsh-dist/nsh/bin/nsh" --version
      - run: nsh check
        working-directory: apps/tui
      - run: nsh test --junit nsh-test.xml
        working-directory: apps/tui
      - run: nsh test --target tui --junit nsh-test-tui.xml
        working-directory: apps/tui
      - name: Keep the nsh test reports and the TUI log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nsh-reports
          path: |
            apps/tui/nsh-test*.xml
            apps/tui/.nsh/tui.log
          if-no-files-found: ignore

  docker:
    name: docker (gateway + backend images, compose smoke test, no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build deploy/Dockerfile (SSH gateway)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: roast-tty-ssh:ci
          # The image layers; the Dockerfile's cargo cache mounts are not exported.
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max
      - name: Build deploy/server.Dockerfile (backend)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/server.Dockerfile
          push: false
          load: true
          tags: roast-tty-server:ci
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
      - name: Smoke-test the images (non-root users, both gateway binaries, the gateway's config)
        run: |
          set -euo pipefail
          docker image ls 'roast-tty-*'
          test "$(docker run --rm --entrypoint id roast-tty-ssh:ci -u)" = 10001
          test "$(docker run --rm --entrypoint id roast-tty-server:ci -u)" = 10001
          docker run --rm --entrypoint sh roast-tty-ssh:ci -c \
            'test -x /usr/local/bin/tty-gateway && test -x /usr/local/bin/coffee-tui && test -f /etc/tty-gateway/gateway.toml'
          # The baked-in configuration checks out where the image runs it (TTY_GATEWAY_CONFIG).
          docker run --rm roast-tty-ssh:ci --check
          # No secret is baked into either image.
          for image in roast-tty-ssh:ci roast-tty-server:ci; do
            ! docker image inspect "$image" --format '{{json .Config.Env}}' | grep -q COFFEE_INTERNAL_KEY
          done
      - name: Smoke-test the pair with deploy/compose.yaml (SSH banner, products, a purchase over ssh)
        env:
          COFFEE_GATEWAY_IMAGE: roast-tty-ssh:ci
          COFFEE_SERVER_IMAGE: roast-tty-server:ci
        run: deploy/smoke-test.sh
      - name: Keep the smoke test's text screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screens
          path: .data/e2e-smoke/*/*.txt
          if-no-files-found: ignore
