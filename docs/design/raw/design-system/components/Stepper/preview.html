  <div style="display:flex;align-items:center;gap:14px">
    <div class="t-stepper"><button aria-label="减少数量">−</button><span class="t-stepper__val">2</span><button aria-label="增加数量">+</button></div>
    <span style="font-size:12px;color:var(--acc2)">现货 42 份 · 每周二、五烘焙</span>
  </div>
  <div class="t-stepper t-stepper--sm"><button aria-label="减少">−</button><span class="t-stepper__val">1</span><button aria-label="增加">+</button></div>
</div>
