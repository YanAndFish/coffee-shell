<!-- @dsCard group="Display" height=230 subtitle="风味条 / 加载进度 / 免运费进度 / 会员等级" -->
<div class="tui" style="padding:20px 24px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px 32px">
  <div style="display:flex;flex-direction:column;gap:12px">
    <div style="display:grid;grid-template-columns:34px minmax(0,1fr) 40px;align-items:center;gap:10px;font-size:13px"><span style="color:var(--mute)">酸度</span><div class="t-meter"><i style="width:80%"></i></div><span style="text-align:right">8</span></div>
    <div style="display:grid;grid-template-columns:34px minmax(0,1fr) 40px;align-items:center;gap:10px;font-size:13px"><span style="color:var(--mute)">甜感</span><div class="t-meter"><i style="width:70%"></i></div><span style="text-align:right">7</span></div>
    <div style="display:grid;grid-template-columns:34px minmax(0,1fr) 40px;align-items:center;gap:10px;font-size:13px"><span style="color:var(--mute)">苦度</span><div class="t-meter"><i style="width:20%"></i></div><span style="text-align:right">2</span></div>
  </div>
  <div role="status" style="display:flex;flex-direction:column;gap:8px">
    <div style="display:flex;justify-content:space-between;font-size:13px"><span><span style="color:var(--acc)">⠹</span> 校验凭据</span><span style="color:var(--mute)">62%</span></div>
    <div class="t-progress"><i style="width:62%"></i></div>
    <div style="display:flex;justify-content:space-between;font-size:13px;margin-top:6px"><span><span style="color:var(--acc)">⠼</span> 锁定烘焙批次</span><span style="color:var(--mute)">40%</span></div>
    <div class="t-progress t-progress--ok"><i style="width:40%"></i></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px">
    <div class="t-thin"><i style="width:72%"></i></div>
    <div style="font-size:12px;color:var(--mute)">再买 ¥56 即可包邮</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:8px">
    <div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:var(--acc);font-weight:700">熟豆会员 Lv.3</span><span style="color:var(--mute)">1,280 / 2,000 豆</span></div>
    <div class="t-meter"><i style="width:64%"></i></div>
  </div>
</div>
