<!-- @dsCard group="Layout" height=250 subtitle="标题压在边框上的面板 / 凹陷信息块 / 小节标题" -->
<div class="tui" style="padding:26px 24px 20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px">
  <section class="t-panel">
    <span class="t-panel__legend">结算 CHECKOUT</span>
    <div class="t-inset" style="display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute)"><span>收货地址</span><button class="t-btn t-btn--link">3 更换 →</button></div>
      <div style="font-weight:700">林晓 <span style="font-weight:400;color:var(--mute);font-size:12px">138 0000 0000</span></div>
    </div>
    <div class="t-rule-dashed"></div>
    <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="color:var(--mute)">合计</span><span style="font-size:30px;font-weight:800;color:var(--acc)">¥216</span></div>
  </section>
  <section class="t-panel">
    <span class="t-panel__legend">预览 PREVIEW</span>
    <h2 class="t-heading">── 豆子档案</h2>
    <p style="margin:0;font-size:13px;line-height:1.7;color:var(--soft)">高海拔小农水洗批次，干香是一把新鲜茉莉。</p>
    <div style="display:flex;gap:12px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:var(--radius-6);background:var(--bg);font-size:13px"><span style="color:var(--mute)">冲煮建议</span><span>1:15 · 92°C · 2′30″</span></div>
  </section>
</div>
