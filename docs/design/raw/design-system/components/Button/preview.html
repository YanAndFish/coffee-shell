<!-- @dsCard group="Actions" height=230 subtitle="每个按钮都带它的快捷键" -->
<div class="tui" style="padding:20px 24px;display:flex;flex-direction:column;gap:16px">
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <button class="t-btn t-btn--primary t-btn--lg" style="width:220px;gap:10px">登录 <kbd class="t-kbd t-kbd--on-acc">⏎</kbd></button>
    <button class="t-btn t-btn--primary t-btn--lg" style="font-size:14px">a 加入购物车</button>
    <button class="t-btn t-btn--outline t-btn--lg" style="font-size:14px">b 立即购买</button>
  </div>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <button class="t-btn"><kbd class="t-kbd">g</kbd>访客浏览</button>
    <button class="t-btn">注册新账号 →</button>
    <button class="t-btn t-btn--danger" style="font-size:14px">q 退出登录</button>
    <button class="t-btn t-btn--green">波奎特 瑰夏 → </button>
  </div>
  <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
    <button class="t-btn t-btn--xs">← Esc 返回</button>
    <button class="t-btn t-btn--sm">⏎ 用于本单</button>
    <button class="t-btn t-btn--sm">e 编辑</button>
    <button class="t-btn t-btn--sm" style="color:var(--disabled)" disabled>space 设为默认</button>
    <button class="t-btn t-btn--sm" style="color:var(--danger)">d 删除</button>
    <button class="t-btn t-btn--undo">已删除 曼特宁 G1 · u 撤销</button>
    <button class="t-btn t-btn--link">3 更换 →</button>
  </div>
</div>
