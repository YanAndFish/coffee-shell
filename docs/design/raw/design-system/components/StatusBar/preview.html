<!-- @dsCard group="Navigation" height=110 subtitle="模式块 + 可点击的快捷键提示" -->
<div class="tui" style="padding:24px 16px">
  <div class="t-status" style="border:1px solid var(--line)">
    <div class="t-status__mode">购物车 <span>CART</span></div>
    <div class="t-status__hints">
      <button class="t-hint"><kbd class="t-kbd t-kbd--flat">↑↓</kbd>移动</button>
      <button class="t-hint"><kbd class="t-kbd t-kbd--flat">space</kbd>勾选</button>
      <button class="t-hint"><kbd class="t-kbd t-kbd--flat">←→</kbd>数量</button>
      <button class="t-hint"><kbd class="t-kbd t-kbd--flat">x</kbd>删除</button>
      <button class="t-hint"><kbd class="t-kbd t-kbd--flat">u</kbd>撤销</button>
      <button class="t-hint"><kbd class="t-kbd t-kbd--flat">c</kbd>结算</button>
    </div>
    <div class="t-status__right">
      <span><span style="color:var(--acc2)">●</span> 鼠标</span>
      <span>购物车 <span style="color:var(--fg)">¥216</span></span>
      <button class="t-hint" style="padding:0 6px"><kbd class="t-kbd t-kbd--flat">?</kbd>帮助</button>
    </div>
  </div>
</div>
