# ROAST/TTY: the SSH gateway and the backend, on one host.
#
#   export COFFEE_INTERNAL_KEY="$(openssl rand -base64 32)"   # or put it in deploy/.env
#   docker compose -f deploy/compose.yaml up -d --build
#   ssh -p 2222 localhost
#
# The backend has no published port: it is reachable only on the `internal` network, where
# the gateway's sessions call it with COFFEE_INTERNAL_KEY. Both services need the same key;
# compose refuses to start without one. Never commit it (`.env*` is git-ignored).
# Settings: deploy/README.md.

name: roast-tty

services:
  backend:
    image: ${COFFEE_SERVER_IMAGE:-roast-tty-server:local}
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    environment:
      COFFEE_INTERNAL_KEY: ${COFFEE_INTERNAL_KEY:?set COFFEE_INTERNAL_KEY (e.g. openssl rand -base64 32)}
    volumes:
      - database:/data
    networks:
      - internal
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']

  gateway:
    image: ${COFFEE_GATEWAY_IMAGE:-roast-tty-ssh:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      COFFEE_API_URL: http://backend:3000
      COFFEE_INTERNAL_KEY: ${COFFEE_INTERNAL_KEY:?set COFFEE_INTERNAL_KEY (e.g. openssl rand -base64 32)}
      # Optional; empty means the gateway's default (deploy/README.md).
      COFFEE_COLORS: ${COFFEE_COLORS:-}
      COFFEE_SSH_MAX_SESSIONS: ${COFFEE_SSH_MAX_SESSIONS:-}
      COFFEE_SSH_MAX_SESSIONS_PER_IP: ${COFFEE_SSH_MAX_SESSIONS_PER_IP:-}
      COFFEE_SSH_CONNECTIONS_PER_MINUTE: ${COFFEE_SSH_CONNECTIONS_PER_MINUTE:-}
      COFFEE_SSH_IDLE_TIMEOUT: ${COFFEE_SSH_IDLE_TIMEOUT:-}
    ports:
      - ${COFFEE_SSH_PORT:-2222}:2222
    volumes:
      - host-key:/data
    networks:
      - public
      - internal
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']

networks:
  # No route out and no published ports: only the gateway reaches the backend.
  internal:
    internal: true
  public: {}

volumes:
  # The SQLite database (accounts, carts, orders of the demo).
  database: {}
  # The gateway's ed25519 host key: keep it, or every client sees a new host key.
  host-key: {}
