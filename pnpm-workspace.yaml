minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
shellEmulator: true

packages:
  - apps/server
  - packages/*

# Dependencies allowed to run install scripts (pnpm refuses all others).
allowBuilds:
  # Prisma CLI: installs the schema engine used by `prisma migrate`.
  '@prisma/engines': true
  # Native SQLite binding used by @prisma/adapter-better-sqlite3.
  better-sqlite3: true
  prisma: true
  # Its postinstall would install the Git hooks; the root `prepare` script does that instead.
  simple-git-hooks: false
